  <style>
    /* ========================================
       DESIGN SYSTEM
       حقیقت سوله
    ======================================== */

    :root {
      /* رنگ‌های اصلی */
      --color-bg: #111315;
      --color-bg-secondary: #1B1F22;
      --color-bg-soft: #24292D;

      /* رنگ متن */
      --color-text: #F2F0EA;
      --color-text-muted: #A7ADB0;
      --color-text-dark: #111315;

      /* رنگ تأکیدی */
      --color-accent: #FF6A00;
      --color-accent-hover: #FF8A3D;

      /* خطوط */
      --color-border: #30363A;
      --color-border-light: rgba(255, 255, 255, 0.12);

      /* وضعیت‌ها */
      --color-success: #38B36B;
      --color-danger: #E05252;

      /* تایپوگرافی */
      --font-main: "Vazirmatn", sans-serif;

      /* اندازه‌ها */
      --container-width: 1240px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 24px;

      /* سایه */
      --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.18);

      /* انتقال */
      --transition: 0.25s ease;
    }

    /* ========================================
       RESET
    ======================================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    ul,
    ol {
      list-style: none;
    }

    /* ========================================
       GLOBAL UTILITIES
    ======================================== */

    .container {
      width: min(100% - 40px, var(--container-width));
      margin-inline: auto;
    }

    .section {
      padding: 100px 0;
    }

    .text-accent {
      color: var(--color-accent);
    }

    .hidden {
      display: none !important;
    }

    /* ========================================
       RESPONSIVE BASE
    ======================================== */

    @media (max-width: 768px) {
      .container {
        width: min(100% - 28px, var(--container-width));
      }

      .section {
        padding: 70px 0;
      }
    }

    @media (max-width: 480px) {
      .section {
        padding: 55px 0;
      }
    }
  </style>
</head>
