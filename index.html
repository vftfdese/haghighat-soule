<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حقیقت سوله | تأمین آهن‌آلات و خدمات صنعتی</title>

  <meta
    name="description"
    content="حقیقت سوله؛ تأمین آهن‌آلات، سوله‌سازی، اجرای فونداسیون و تجهیزات جرثقیل صنعتی."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ========================================
       DESIGN SYSTEM
    ======================================== */

    :root {
      --color-bg: #111315;
      --color-bg-secondary: #1B1F22;
      --color-bg-soft: #24292D;

      --color-text: #F2F0EA;
      --color-text-muted: #A7ADB0;
      --color-text-dark: #111315;

      --color-accent: #FF6A00;
      --color-accent-hover: #FF8A3D;

      --color-border: #30363A;
      --color-border-light: rgba(255,255,255,0.12);

      --font-main: "Vazirmatn", sans-serif;

      --container-width: 1240px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 24px;

      --shadow-soft: 0 10px 40px rgba(0,0,0,0.18);
      --transition: 0.25s ease;
    }

    /* ========================================
       RESET
    ======================================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    ul {
      list-style: none;
    }

    .container {
      width: min(100% - 40px, var(--container-width));
      margin-inline: auto;
    }

    /* ========================================
       HEADER
    ======================================== */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(17, 19, 21, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--color-border-light);
    }

    .header-inner {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    /* برند */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 2px solid var(--color-accent);
      display: grid;
      place-items: center;
      color: var(--color-accent);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -1px;
      transform: skew(-8deg);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 10px;
      font-weight: 400;
      color: var(--color-text-muted);
      letter-spacing: 1px;
      direction: ltr;
      text-align: right;
    }

    /* منوی دسکتاپ */

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-right: auto;
    }

    .desktop-nav a {
      position: relative;
      color: var(--color-text-muted);
      font-size: 13px;
      font-weight: 500;
      transition: color var(--transition);
      padding: 8px 0;
    }

    .desktop-nav a::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 2px;
      background: var(--color-accent);
      transition: width var(--transition);
    }

    .desktop-nav a:hover {
      color: var(--color-text);
    }

    .desktop-nav a:hover::after {
      width: 100%;
    }

    /* دکمه مشاوره */

    .header-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--color-accent);
      color: #fff;
      padding: 11px 19px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition:
        background var(--transition),
        transform var(--transition);
    }

    .header-cta:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
    }

    .header-cta .arrow {
      font-size: 16px;
      line-height: 1;
    }

    /* دکمه موبایل */

    .mobile-menu-btn {
      display: none;
      width: 42px;
      height: 42px;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      color: var(--color-text);
      font-size: 22px;
      align-items: center;
      justify-content: center;
    }

    /* منوی موبایل */

    .mobile-nav {
      display: none;
      border-top: 1px solid var(--color-border-light);
      padding: 15px 0 20px;
    }

    .mobile-nav.active {
      display: block;
    }

    .mobile-nav ul {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mobile-nav a {
      display: block;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      color: var(--color-text-muted);
      font-size: 14px;
      transition: background var(--transition), color var(--transition);
    }

    .mobile-nav a:hover {
      background: var(--color-bg-secondary);
      color: var(--color-text);
    }

    .mobile-nav .mobile-cta {
      margin-top: 12px;
      background: var(--color-accent);
      color: #fff;
      text-align: center;
      font-weight: 700;
    }

    /* ========================================
       MAIN PLACEHOLDER
    ======================================== */

    main {
      min-height: 500px;
    }

    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (max-width: 900px) {
      .desktop-nav {
        gap: 18px;
      }

      .desktop-nav a {
        font-size: 12px;
      }

      .header-cta {
        padding: 10px 14px;
      }
    }

    @media (max-width: 768px) {
      .container {
        width: min(100% - 28px, var(--container-width));
      }

      .header-inner {
        min-height: 72px;
      }

      .desktop-nav,
      .header-cta {
        display: none;
      }

      .mobile-menu-btn {
        display: flex;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .brand-name {
        font-size: 15px;
      }

      .brand-subtitle {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- ========================================
       HEADER
  ======================================== -->

  <header class="site-header">

    <div class="container">

      <div class="header-inner">

        <!-- برند -->
        <a href="#" class="brand">

          <div class="brand-mark">HS</div>

          <div class="brand-text">
            <span class="brand-name">حقیقت سوله</span>
            <span class="brand-subtitle">STEEL • INDUSTRIAL</span>
          </div>

        </a>


        <!-- منوی دسکتاپ -->
        <nav class="desktop-nav">
          <a href="#home">خانه</a>
          <a href="#products">محصولات</a>
          <a href="#services">خدمات</a>
          <a href="#projects">پروژه‌ها</a>
          <a href="#about">درباره ما</a>
          <a href="#contact">تماس با ما</a>
        </nav>


        <!-- دکمه مشاوره دسکتاپ -->
        <a href="#contact" class="header-cta">
          مشاوره رایگان
          <span class="arrow">←</span>
        </a>


        <!-- دکمه منوی موبایل -->
        <button
          class="mobile-menu-btn"
          id="mobileMenuBtn"
          aria-label="باز کردن منو"
          aria-expanded="false"
        >
          ☰
        </button>

      </div>


      <!-- منوی موبایل -->
      <nav class="mobile-nav" id="mobileNav">

        <ul>
          <li><a href="#home">خانه</a></li>
          <li><a href="#products">محصولات آهن‌آلات</a></li>
          <li><a href="#services">خدمات صنعتی</a></li>
          <li><a href="#projects">پروژه‌ها</a></li>
          <li><a href="#about">درباره ما</a></li>
          <li><a href="#contact">تماس با ما</a></li>
          <li><a href="#contact" class="mobile-cta">درخواست مشاوره رایگان</a></li>
        </ul>

      </nav>

    </div>

  </header>


  <!-- ========================================
       MAIN
       مراحل بعدی اینجا اضافه می‌شوند
  ======================================== -->

  <main id="main-content">

  </main>


  <!-- ========================================
       FOOTER
  ======================================== -->

  <footer id="site-footer"></footer>


  <!-- ========================================
       JAVASCRIPT
  ======================================== -->

  <script>

    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const mobileNav = document.getElementById("mobileNav");

    mobileMenuBtn.addEventListener("click", () => {

      const isOpen = mobileNav.classList.toggle("active");

      mobileMenuBtn.setAttribute("aria-expanded", isOpen);

      mobileMenuBtn.textContent = isOpen ? "×" : "☰";

    });


    // بستن منوی موبایل پس از کلیک روی لینک
    document.querySelectorAll(".mobile-nav a").forEach(link => {

      link.addEventListener("click", () => {

        mobileNav.classList.remove("active");
        mobileMenuBtn.setAttribute("aria-expanded", "false");
        mobileMenuBtn.textContent = "☰";

      });

    });

  </script>

</body>
  </html>
