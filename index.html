<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حقیقت سوله | فروش آهن‌آلات و محصولات فولادی</title>

  <meta
    name="description"
    content="فروش و تأمین آهن‌آلات شامل تیرآهن، میلگرد، ورق، پروفیل و محصولات فولادی. استعلام قیمت و مشاوره خرید از حقیقت سوله."
  >

  <meta
    name="keywords"
    content="خرید آهن, فروش آهن, تیرآهن, میلگرد, ورق فولادی, پروفیل, پرلین, آهن آلات, حقیقت سوله"
  >

  <meta name="theme-color" content="#090b0d">

  <style>

    /* =========================
       ROOT / THEME
    ========================== */

    :root {
      --bg: #090b0d;
      --bg2: #0d1012;
      --card: #15191c;
      --card2: #121518;

      --text: #ffffff;
      --text-soft: #d0d0d0;
      --muted: #929292;

      --border: rgba(255,255,255,.08);

      --accent: #f5b400;
      --accent-hover: #ffc52b;

      --header: rgba(8,10,12,.82);

      --shadow: 0 20px 60px rgba(0,0,0,.25);
    }


    body.light {

      --bg: #f3f3f1;
      --bg2: #ffffff;
      --card: #ffffff;
      --card2: #eeeeec;

      --text: #151719;
      --text-soft: #444444;
      --muted: #707070;

      --border: rgba(0,0,0,.10);

      --accent: #d99d00;
      --accent-hover: #b98200;

      --header: rgba(255,255,255,.86);

      --shadow: 0 20px 50px rgba(0,0,0,.08);
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      line-height: 1.8;

      transition:
        background .3s ease,
        color .3s ease;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    img {
      max-width: 100%;
      display: block;
    }


    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }


    .container {
      width: min(1180px, 92%);
      margin: auto;
    }


    /* =========================
       HEADER
    ========================== */

    header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;

      z-index: 1000;

      background: var(--header);

      backdrop-filter: blur(18px);

      border-bottom: 1px solid var(--border);
    }


    .nav {
      height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }


    .logo {
      font-size: 23px;
      font-weight: 900;
      white-space: nowrap;
    }


    .logo span {
      color: var(--accent);
    }


    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }


    .nav-links a {
      color: var(--text-soft);
      font-size: 14px;

      transition: .25s;
    }


    .nav-links a:hover {
      color: var(--accent);
    }


    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .theme-btn,
    .menu-btn {
      width: 42px;
      height: 42px;

      border: 1px solid var(--border);

      border-radius: 12px;

      background: var(--card);

      color: var(--text);

      cursor: pointer;

      font-size: 18px;

      transition: .25s;
    }


    .theme-btn:hover,
    .menu-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }


    .header-call {
      padding: 10px 17px;

      border-radius: 12px;

      background: var(--accent);

      color: #111;

      font-size: 13px;

      font-weight: 800;

      transition: .25s;
    }


    .header-call:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }


    .menu-btn {
      display: none;
    }


    /* =========================
       MOBILE MENU
    ========================== */

    .mobile-menu {
      display: none;

      padding: 15px 20px 22px;

      background: var(--bg2);

      border-top: 1px solid var(--border);
    }


    .mobile-menu.active {
      display: block;
    }


    .mobile-menu a {
      display: block;

      padding: 13px 0;

      color: var(--text-soft);

      border-bottom: 1px solid var(--border);
    }


    .mobile-menu a:hover {
      color: var(--accent);
    }


    .mobile-call {
      margin-top: 15px;

      display: block;

      text-align: center;

      padding: 12px;

      border-radius: 12px;

      background: var(--accent);

      color: #111 !important;

      font-weight: 800;
    }


    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 720px;

      display: flex;
      align-items: center;

      position: relative;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.88),
          rgba(0,0,0,.58)
        ),
        url("soule.jpg")
        center/cover no-repeat;
    }


    .hero-content {
      padding-top: 80px;

      max-width: 720px;
    }


    .hero-label {
      display: inline-flex;

      padding: 7px 13px;

      border: 1px solid rgba(245,180,0,.35);

      background: rgba(245,180,0,.08);

      color: var(--accent);

      border-radius: 999px;

      font-size: 12px;

      margin-bottom: 20px;
    }


    .hero h1 {
      font-size: clamp(38px, 6vw, 70px);

      line-height: 1.15;

      font-weight: 900;

      margin-bottom: 24px;
    }


    .hero h1 span {
      color: var(--accent);
    }


    .hero p {
      color: #ddd;

      font-size: 17px;

      max-width: 650px;

      margin-bottom: 32px;
    }


    .hero-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;
    }


    .btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 50px;

      padding: 0 22px;

      border-radius: 13px;

      font-size: 14px;

      font-weight: 800;

      border: 1px solid transparent;

      transition: .25s;
    }


    .btn-primary {
      background: var(--accent);

      color: #111;
    }


    .btn-primary:hover {
      background: var(--accent-hover);

      transform: translateY(-3px);
    }


    .btn-outline {
      border-color: rgba(255,255,255,.2);

      background: rgba(255,255,255,.05);

      color: white;
    }


    .btn-outline:hover {
      border-color: var(--accent);

      color: var(--accent);
    }


    /* =========================
       SECTION
    ========================== */

    section {
      padding: 95px 0;
    }


    .section-head {
      display: flex;

      align-items: end;

      justify-content: space-between;

      gap: 30px;

      margin-bottom: 45px;
    }


    .section-title small {
      display: block;

      color: var(--accent);

      font-size: 13px;

      margin-bottom: 8px;

      font-weight: 800;
    }


    .section-title h2 {
      font-size: clamp(28px, 4vw, 42px);

      line-height: 1.3;
    }


    .section-head p {
      color: var(--muted);

      max-width: 500px;

      font-size: 14px;
    }


    /* =========================
       CATEGORIES
    ========================== */

    .categories {
      background: var(--bg2);
    }


    .category-grid {
      display: grid;

      grid-template-columns:
        repeat(6, 1fr);

      gap: 12px;
    }


    .category {
      padding: 22px 14px;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 16px;

      text-align: center;

      transition: .25s;
    }


    .category:hover {
      transform: translateY(-5px);

      border-color: rgba(245,180,0,.45);
    }


    .category-icon {
      font-size: 28px;

      margin-bottom: 8px;
    }


    .category strong {
      display: block;

      font-size: 14px;
    }


    .category span {
      color: var(--muted);

      font-size: 11px;
    }


    /* =========================
       PRODUCTS
    ========================== */

    .products {
      background: var(--bg);
    }


    .product-tools {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 30px;
    }


    .search-box {
      flex: 1;

      max-width: 480px;

      position: relative;
    }


    .search-box input {
      width: 100%;

      height: 48px;

      padding:
        0 45px
        0 15px;

      border:
        1px solid var(--border);

      border-radius: 13px;

      outline: none;

      background: var(--card);

      color: var(--text);

      font-size: 13px;
    }


    .search-box input:focus {
      border-color: var(--accent);
    }


    .search-icon {
      position: absolute;

      right: 15px;

      top: 50%;

      transform: translateY(-50%);

      opacity: .6;
    }


    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
    }


    .product-card {
      overflow: hidden;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 20px;

      transition: .3s;

      box-shadow: var(--shadow);
    }


    .product-card:hover {
      transform: translateY(-7px);

      border-color:
        rgba(245,180,0,.4);
    }


    .product-image {
      height: 220px;

      overflow: hidden;

      background: var(--card2);
    }


    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: .4s;
    }


    .product-card:hover
    .product-image img {
      transform: scale(1.05);
    }


    .product-info {
      padding: 20px;
    }


    .product-info h3 {
      font-size: 20px;

      margin-bottom: 7px;
    }


    .product-info p {
      color: var(--muted);

      font-size: 12px;

      min-height: 45px;

      margin-bottom: 15px;
    }


    .product-meta {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 15px;
    }


    .product-tag {
      color: var(--accent);

      font-size: 12px;

      font-weight: 800;
    }


    .price-label {
      color: var(--muted);

      font-size: 11px;
    }


    .product-button {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      height: 45px;

      border-radius: 11px;

      background: var(--accent);

      color: #111;

      font-weight: 900;

      font-size: 13px;

      transition: .25s;
    }


    .product-button:hover {
      background: var(--accent-hover);
    }


    .no-results {
      display: none;

      padding: 30px;

      text-align: center;

      color: var(--muted);
    }


    /* =========================
       WHY US
    ========================== */

    .why {
      background: var(--bg2);
    }


    .why-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;
    }


    .why-card {
      padding: 28px 22px;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 18px;
    }


    .why-number {
      color: var(--accent);

      font-size: 30px;

      font-weight: 900;

      margin-bottom: 12px;
    }


    .why-card h3 {
      margin-bottom: 8px;

      font-size: 18px;
    }


    .why-card p {
      color: var(--muted);

      font-size: 13px;
    }


    /* =========================
       PRICE CTA
    ========================== */

    .quote {
      background:
        linear-gradient(
          135deg,
          var(--card),
          var(--bg2)
        );
    }


    .quote-box {
      position: relative;

      overflow: hidden;

      padding: 55px;

      border-radius: 25px;

      border:
        1px solid rgba(245,180,0,.22);

      background:
        linear-gradient(
          135deg,
          rgba(245,180,0,.10),
          transparent
        );
    }


    .quote-box h2 {
      font-size: clamp(28px, 4vw, 45px);

      margin-bottom: 12px;
    }


    .quote-box p {
      color: var(--text-soft);

      max-width: 650px;

      margin-bottom: 25px;

      font-size: 14px;
    }


    .quote-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;
    }


    /* =========================
       CONTACT
    ========================== */

    .contact {
      background: var(--bg);
    }


    .contact-grid {
      display: grid;

      grid-template-columns:
        1fr 1.2fr;

      gap: 25px;
    }


    .contact-info,
    .contact-form {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 20px;

      padding: 30px;
    }


    .contact-info h3,
    .contact-form h3 {
      font-size: 23px;

      margin-bottom: 20px;
    }


    .contact-item {
      display: flex;

      align-items: flex-start;

      gap: 14px;

      padding: 17px 0;

      border-bottom: 1px solid var(--border);
    }


    .contact-item:last-child {
      border-bottom: none;
    }


    .contact-icon {
      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      flex-shrink: 0;

      border-radius: 11px;

      background:
        rgba(245,180,0,.10);

      color: var(--accent);
    }


    .contact-item strong {
      display: block;

      font-size: 14px;

      margin-bottom: 3px;
    }


    .contact-item span,
    .contact-item a {
      color: var(--muted);

      font-size: 12px;
    }


    .contact-item a:hover {
      color: var(--accent);
    }


    .form-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 13px;
    }


    .form-group {
      margin-bottom: 13px;
    }


    .form-group.full {
      grid-column: 1 / -1;
    }


    .form-group label {
      display: block;

      font-size: 12px;

      color: var(--text-soft);

      margin-bottom: 6px;
    }


    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;

      border:
        1px solid var(--border);

      background: var(--bg2);

      color: var(--text);

      outline: none;

      border-radius: 11px;

      padding: 12px;

      font-size: 12px;
    }


    .form-group input,
    .form-group select {
      height: 45px;
    }


    .form-group textarea {
      min-height: 100px;

      resize: vertical;
    }


    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }


    .form-submit {
      width: 100%;

      border: none;

      cursor: pointer;

      height: 48px;

      border-radius: 11px;

      background: var(--accent);

      color: #111;

      font-weight: 900;

      transition: .25s;
    }


    .form-submit:hover {
      background: var(--accent-hover);

      transform: translateY(-2px);
    }


    /* =========================
       FOOTER
    ========================== */

    footer {
      background: #070809;

      color: white;

      padding: 60px 0 25px;
    }


    .footer-grid {
      display: grid;

      grid-template-columns:
        1.5fr 1fr 1fr 1.2fr;

      gap: 40px;

      padding-bottom: 40px;

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }


    .footer-logo {
      font-size: 24px;

      font-weight: 900;

      margin-bottom: 15px;
    }


    .footer-logo span {
      color: var(--accent);
    }


    .footer-about {
      color: #929292;

      font-size: 12px;

      max-width: 350px;
    }


    footer h4 {
      margin-bottom: 15px;

      font-size: 14px;
    }


    footer ul {
      list-style: none;
    }


    footer li {
      margin-bottom: 9px;
    }


    footer li a {
      color: #929292;

      font-size: 12px;

      transition: .25s;
    }


    footer li a:hover {
      color: var(--accent);
    }


    .footer-bottom {
      padding-top: 20px;

      display: flex;

      justify-content: space-between;

      gap: 15px;

      color: #777;

      font-size: 11px;
    }


    /* =========================
       WHATSAPP
    ========================== */

    .whatsapp {
      position: fixed;

      left: 22px;

      bottom: 22px;

      z-index: 900;

      width: 55px;
      height: 55px;

      display: grid;

      place-items: center;

      border-radius: 50%;

      background: #25D366;

      color: white;

      font-size: 25px;

      box-shadow:
        0 10px 30px rgba(0,0,0,.3);

      transition: .25s;
    }


    .whatsapp:hover {
      transform: scale(1.08);
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 1000px) {

      .product-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .why-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .category-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .footer-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }
    }


    @media (max-width: 760px) {

      .nav-links,
      .header-call {
        display: none;
      }

      .menu-btn {
        display: block;
      }

      .hero {
        min-height: 650px;
      }

      .hero h1 {
        font-size: 40px;
      }

      .hero p {
        font-size: 14px;
      }

      .section-head {
        display: block;
      }

      .section-head p {
        margin-top: 12px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }

      .category-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .product-tools {
        display: block;
      }

      .search-box {
        max-width: none;
      }

      .quote-box {
        padding: 35px 24px;
      }
    }


    @media (max-width: 520px) {

      section {
        padding: 70px 0;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .why-grid {
        grid-template-columns: 1fr;
      }

      .category-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }

      .footer-bottom {
        display: block;
      }

      .footer-bottom div + div {
        margin-top: 8px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .hero-buttons,
      .quote-buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .whatsapp {
        left: 16px;
        bottom: 16px;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="container nav">

      <a href="#home" class="logo">
        حقیقت <span>سوله</span>
      </a>


      <nav class="nav-links">

        <a href="#home">خانه</a>

        <a href="#products">محصولات</a>

        <a href="#categories">دسته‌بندی</a>

        <a href="#why">مزیت‌ها</a>

        <a href="#contact">تماس با ما</a>

      </nav>


      <div class="nav-actions">

        <a
          href="tel:09121326034"
          class="header-call"
        >
          تماس با ما
        </a>


        <button
          class="theme-btn"
          id="themeBtn"
          aria-label="تغییر حالت نمایش"
        >
          🌙
        </button>


        <button
          class="menu-btn"
          id="menuBtn"
          aria-label="باز کردن منو"
        >
          ☰
        </button>

      </div>

    </div>


    <div
      class="mobile-menu"
      id="mobileMenu"
    >

      <a href="#home">خانه</a>

      <a href="#products">محصولات</a>

      <a href="#categories">دسته‌بندی محصولات</a>

      <a href="#why">چرا حقیقت سوله؟</a>

      <a href="#contact">تماس با ما</a>

      <a
        href="tel:09121326034"
        class="mobile-call"
      >
        📞 تماس مستقیم
      </a>

    </div>

  </header>



  <!-- =========================
       HERO
  ========================== -->

  <main id="home">

    <section class="hero">
