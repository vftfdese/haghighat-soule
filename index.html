<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حقیقت سوله | ساخت سوله و تأمین آهن‌آلات</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#080b0d;
    color:#f5f5f5;
    line-height:1.8;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    width:100%;
    display:block;
}

.container{
    width:90%;
    max-width:1150px;
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(8,11,13,.94);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #242a2e;
}

nav{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#f3b544;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
}

.nav-links a{
    color:#c7cbd0;
    font-size:14px;
}

.nav-links a:hover{
    color:#f3b544;
}

/* HERO */

.hero{
    min-height:88vh;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.hero-bg{
    position:absolute;
    inset:0;
    z-index:-2;
}

.hero-bg img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-overlay{
    position:absolute;
    inset:0;
    z-index:-1;
    background:
        linear-gradient(
            90deg,
            rgba(8,11,13,.98),
            rgba(8,11,13,.78),
            rgba(8,11,13,.38)
        );
}

.hero-content{
    max-width:720px;
    padding:90px 0;
}

.badge{
    display:inline-block;
    padding:7px 14px;
    border:1px solid #51575b;
    border-radius:30px;
    color:#f3b544;
    font-size:13px;
    margin-bottom:22px;
}

.hero h1{
    font-size:clamp(38px,7vw,70px);
    line-height:1.3;
    margin-bottom:20px;
}

.hero h1 span{
    color:#f3b544;
}

.hero p{
    color:#c2c7ca;
    max-width:620px;
    font-size:16px;
    margin-bottom:32px;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:13px 22px;
    border-radius:7px;
    font-weight:bold;
    transition:.3s;
}

.btn-primary{
    background:#f3b544;
    color:#101010;
}

.btn-primary:hover{
    transform:translateY(-3px);
}

.btn-secondary{
    border:1px solid #555d62;
    color:#fff;
}

.btn-secondary:hover{
    border-color:#f3b544;
    color:#f3b544;
}

/* SECTIONS */

section{
    padding:90px 0;
}

.section-title{
    margin-bottom:40px;
}

.section-title small{
    color:#f3b544;
}

.section-title h2{
    font-size:34px;
    margin-top:6px;
}

.section-title p{
    color:#92999e;
    margin-top:8px;
}

/* SERVICES */

.services-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.service{
    background:#111619;
    border:1px solid #242b30;
    padding:27px 22px;
    border-radius:12px;
    transition:.3s;
}

.service:hover{
    transform:translateY(-5px);
    border-color:#f3b544;
}

.service-number{
    color:#f3b544;
    font-size:13px;
    margin-bottom:12px;
}

.service h3{
    margin-bottom:8px;
}

.service p{
    color:#969da2;
    font-size:14px;
}

/* PRODUCTS */

.products{
    background:#0e1316;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product{
    background:#151b1f;
    border:1px solid #293137;
    border-radius:12px;
    overflow:hidden;
    transition:.3s;
}

.product:hover{
    transform:translateY(-5px);
    border-color:#f3b544;
}

.product-image{
    height:210px;
    overflow:hidden;
}

.product-image img{
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.product:hover img{
    transform:scale(1.05);
}

.product-info{
    padding:20px;
}

.product-info h3{
    margin-bottom:7px;
}

.product-info p{
    color:#969da2;
    font-size:13px;
}

/* ABOUT */

.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
}

.about-text p{
    color:#aab1b5;
    margin-bottom:25px;
}

.features{
    display:grid;
    gap:13px;
}

    border:1px solid #242b30;
