<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="حقیقت سوله؛ فروش آهن‌آلات، فونداسیون، جرثقیل و سوله‌سازی از سال ۱۳۸۹ تاکنون">
  <title>حقیقت سوله | فروش آهن‌آلات و خدمات صنعتی</title>

  <style>
    :root {
      --bg: #0e1011;
      --bg2: #171a1b;
      --card: #1b1f20;
      --text: #f4f4f4;
      --muted: #aab0b1;
      --border: rgba(255,255,255,0.12);
      --accent: #e5b83f;
      --accent-hover: #f2cc61;
      --dark-text: #111;
      --shadow: 0 15px 45px rgba(0,0,0,0.25);
    }

    body.light {
      --bg: #f3f3ef;
      --bg2: #ffffff;
      --card: #ffffff;
      --text: #181a19;
      --muted: #626866;
      --border: rgba(0,0,0,0.12);
      --accent: #ae7d0b;
      --accent-hover: #c89519;
      --dark-text: #ffffff;
      --shadow: 0 15px 45px rgba(0,0,0,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.9;
      transition: background 0.3s ease, color 0.3s ease;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: calc(100% - 32px);
      max-width: 1180px;
      margin: auto;
    }

    .section {
      padding: 90px 0;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.4;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .section-description {
      color: var(--muted);
      font-size: 14px;
      max-width: 570px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 42px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 11px 22px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      transition: 0.25s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: #111;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      border-color: var(--border);
      color: var(--text);
      background: transparent;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Header */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
      padding: 3px;
    }

    .brand-text strong {
      display: block;
      font-size: 16px;
      line-height: 1.4;
    }

    .brand-text small {
      color: var(--muted);
      font-size: 10px;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: 13px;
    }

    .desktop-nav a {
      color: var(--muted);
      transition: 0.2s;
    }

    .desktop-nav a:hover {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-call {
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 7px;
      font-size: 18px;
    }

    .icon-button:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .menu-button {
      display: none;
    }

    .mobile-menu {
      display: none;
      padding: 12px 16px 18px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }

    .mobile-menu.active {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    /* Hero */

    .hero {
      min-height: 710px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(90deg, rgba(14,16,17,0.97) 8%, rgba(14,16,17,0.78) 52%, rgba(14,16,17,0.25)),
        url("images/home/industrial-complex-aerial.jpg") center/cover no-repeat;
    }

    body.light .hero {
      background:
        linear-gradient(90deg, rgba(243,243,239,0.97) 8%, rgba(243,243,239,0.8) 52%, rgba(243,243,239,0.3)),
        url("images/home/industrial-complex-aerial.jpg") center/cover no-repeat;
    }

    .hero-content {
      max-width: 750px;
      padding: 80px 0;
    }

    .hero-label {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 22px;
    }

    .hero-label::before {
      content: "";
      width: 38px;
      height: 2px;
      background: var(--accent);
    }

    .hero-title {
      font-size: clamp(42px, 7vw, 84px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-description {
      color: var(--muted);
      max-width: 600px;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-note {
      margin-top: 25px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Stats */

    .stats {
      margin-top: -55px;
      position: relative;
      z-index: 5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .stat {
      padding: 28px 15px;
      text-align: center;
      border-left: 1px solid var(--border);
    }

    .stat:last-child {
      border-left: none;
    }

    .stat strong {
      display: block;
      color: var(--accent);
      font-size: 25px;
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    /* Services */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .service-card {
      position: relative;
      min-height: 350px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: end;
      background: var(--card);
      transition: 0.3s;
    }

    .service-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
    }

    .service-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(0deg, rgba(0,0,0,0.95), rgba(0,0,0,0.1)),
        var(--service-image) center/cover no-repeat;
      transition: 0.4s;
    }

    .service-card:hover::before {
      transform: scale(1.06);
    }

    .service-content {
      position: relative;
      z-index: 2;
      padding: 23px;
      width: 100%;
    }

    .service-number {
      color: var(--accent);
      font-size: 11px;
      display: block;
      margin-bottom: 35px;
    }

    .service-content h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .service-content p {
      color: #d0d0d0;
      font-size: 12px;
      margin-bottom: 12px;
      line-height: 1.9;
    }

    .service-link {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    /* Products */

    .products-section {
      background: var(--bg2);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .product-image {
      height: 210px;
      background-position: center;
      background-size: cover;
      position: relative;
    }

    .product-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.55), transparent);
    }

    .product-body {
      padding: 20px;
    }

    .product-body h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .product-body p {
      color: var(--muted);
      font-size: 12px;
      min-height: 48px;
      margin-bottom: 17px;
    }

    .product-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--accent);
      color: #111;
      border-radius: 7px;
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .product-action:hover {
      background: var(--accent-hover);
    }

    /* Detail */

    .detail-section {
      border-bottom: 1px solid var(--border);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .detail-grid.reverse .detail-image {
      order: 2;
    }

    .detail-grid.reverse .detail-content {
      order: 1;
    }

    .detail-image {
      height: 430px;
      border-radius: 14px;
      background-position: center;
      background-size: cover;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .detail-content h2 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .detail-content h2 span {
      color: var(--accent);
    }

    .detail-content p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
    }

    .feature-list {
      list-style: none;
      display: grid;
      gap: 11px;
      margin-bottom: 25px;
    }

    .feature-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .feature-list li::before {
      content: "✓";
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent);
      background: rgba(229,184,63,0.14);
      font-weight: bold;
    }

    /* About */

    .about-section {
      background: var(--bg2);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .about-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 35px;
      position: relative;
      overflow: hidden;
    }

    .about-box::after {
      content: "۱۳۸۹";
      position: absolute;
      left: -10px;
      bottom: -25px;
      color: rgba(229,184,63,0.06);
      font-size: 115px;
      font-weight: 900;
      line-height: 1;
    }

    .about-box h3 {
      font-size: 28px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .about-box p {
      color: var(--muted);
      font-size: 14px;
      position: relative;
      z-index: 1;
    }

    .about-points {
      display: grid;
      gap: 20px;
    }

    .about-point {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .about-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-size: 18px;
    }

    .about-point h4 {
      font-size: 15px;
      margin-bottom: 3px;
    }

    .about-point p {
      color: var(--muted);
      font-size: 12px;
    }

    /* CTA */

    .cta {
      padding: 75px 0;
    }

    .cta-box {
      padding: 55px;
      border-radius: 15px;
      background:
        linear-gradient(110deg, rgba(229,184,63,0.96), rgba(175,132,22,0.94)),
        url("images/home/industrial-complex-aerial.jpg") center/cover;
      color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
    }

    .cta-box h2 {
      font-size: clamp(27px, 4vw, 45px);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .cta-box p {
      font-size: 14px;
      max-width: 600px;
    }

    .cta-box .btn-outline {
      color: #111;
      border-color: #111;
      white-space: nowrap;
    }

    .cta-box .btn-outline:hover {
      background: #111;
      color: #fff;
    }

    /* Contact */

    .contact-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 25px;
    }

    .contact-card,
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
    }

    .contact-card h3,
    .form-card h3 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .contact-item {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
    }

    .contact-item:last-child {
      border-bottom: none;
    }

    .contact-symbol {
      color: var(--accent);
      font-size: 20px;
      width: 25px;
      flex-shrink: 0;
    }

    .contact-item small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 3px;
    }

    .contact-item strong,
    .contact-item a {
      font-size: 14px;
    }

    .contact-item a:hover {
      color: var(--accent);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      color: var(--muted);
      font-size: 12px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg2);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea {
      min-height: 125px;
      resize: vertical;
    }

    .form-note {
      color: var(--muted);
      font-size: 11px;
      margin-top: 12px;
    }

    /* Footer */

    footer {
      padding: 35px 0;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-copy {
      color: var(--muted);
      font-size: 12px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    /* Floating */

    .floating-actions {
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .floating-button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 21px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      transition: 0.25s;
    }

    .floating-button:hover {
      transform: scale(1.08);
    }

    .call-button {
      background: #2179d1;
    }

    .whatsapp-button {
      background: #1cae5a;
    }

    /* Responsive */

    @media (max-width: 1050px) {
      .services-grid,
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .desktop-nav {
        gap: 15px;
      }
    }

    @media (max-width: 760px) {
      .section {
        padding: 65px 0;
      }

      .section-heading {
        display: block;
      }

      .section-description {
        margin-top: 12px;
      }

      .desktop-nav,
      .header-call {
        display: none;
      }

      .menu-button {
        display: grid;
      }

      .hero {
        min-height: 680px;
      }

      .hero-title {
        font-size: 47px;
        letter-spacing: -1px;
      }

      .hero-description {
        font-size: 14px;
      }

      .detail-grid,
      .detail-grid.reverse,
      .about-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .detail-grid.reverse .detail-image,
      .detail-grid.reverse .detail-content {
        order: initial;
      }

      .detail-image {
        height: 310px;
      }

      .cta-box {
        display: block;
        padding: 35px 25px;
      }

      .cta-box .btn {
        margin-top: 22px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 500px) {
      .container {
        width: calc(100% - 24px);
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat {
        padding: 22px 10px;
      }

      .stat:nth-child(1),
      .stat:nth-child(2) {
        border-bottom: 1px solid var(--border);
      }

      .stat:nth-child(2) {
        border-left: none;
      }

      .stat strong {
        font-size: 22px;
      }

      .services-grid,
      .products-grid {
        grid-template-columns: 1fr;
      }

      .service-card {
        min-height: 315px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .contact-card,
      .form-card {
        padding: 23px;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .hero-buttons .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body id="top">

  <!-- Header -->
  <header>
    <div class="container header-inner">

      <a href="#top" class="brand">
        <img
          class="brand-logo"
          src="images/branding/haghighat-soleh-logo.jpg"
          alt="لوگوی حقیقت سوله"
        >

        <div class="brand-text">
          <strong>حقیقت سوله</strong>
          <small>فروش آهن‌آلات و خدمات صنعتی</small>
        </div>
      </a>

      <nav class="desktop-nav">
        <a href="#services">خدمات</a>
        <a href="#iron">فروش آهن</a>
        <a href="#about">درباره ما</a>
        <a href="#contact">تماس با ما</a>
      </nav>

      <div class="header-actions">

        <a
          href="tel:+989121326034"
          class="header-call"
        >
          تماس مستقیم
        </a>

        <button
          type="button"
          class="icon-button"
          id="themeToggle"
          title="تغییر حالت نمایش"
        >
          ☀
        </button>

        <button
          type="button"
          class="icon-button menu-button"
          id="menuToggle"
