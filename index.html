<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حقیقت سوله | فروش آهن‌آلات و اجرای پروژه‌های صنعتی</title>

<meta name="description" content="حقیقت سوله؛ تأمین و فروش آهن‌آلات، اجرای فونداسیون، جرثقیل و سوله‌سازی در شهرک صنعتی شمس‌آباد تهران.">
<meta name="theme-color" content="#111315">

<style>
/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;
    background:#101214;
    color:#f4f4f4;
    line-height:1.9;
    overflow-x:hidden;
}

img{
    max-width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

:root{
    --bg:#101214;
    --bg2:#151719;
    --card:#191c1f;
    --card2:#202428;
    --text:#f5f5f5;
    --muted:#a7adb3;
    --yellow:#f5b900;
    --yellow2:#ffc928;
    --border:rgba(255,255,255,.09);
    --shadow:0 20px 60px rgba(0,0,0,.3);
    --radius:22px;
}

body.light{
    --bg:#f4f4f1;
    --bg2:#ffffff;
    --card:#ffffff;
    --card2:#eeeeea;
    --text:#111315;
    --muted:#62676c;
    --border:rgba(0,0,0,.09);
    --shadow:0 20px 50px rgba(0,0,0,.08);
}


/* =========================
   GLOBAL
========================= */

.container{
    width:min(1180px,92%);
    margin:auto;
}

section{
    padding:100px 0;
    position:relative;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
    margin-bottom:45px;
}

.section-label{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:var(--yellow);
    font-size:13px;
    font-weight:bold;
    margin-bottom:12px;
}

.section-label::before{
    content:"";
    width:28px;
    height:2px;
    background:var(--yellow);
}

.section-title{
    font-size:clamp(30px,5vw,48px);
    line-height:1.35;
    font-weight:900;
    letter-spacing:-1px;
}

.section-description{
    max-width:540px;
    color:var(--muted);
    font-size:15px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:50px;
    padding:0 22px;
    border-radius:12px;
    border:1px solid var(--border);
    font-weight:bold;
    font-size:14px;
    transition:.25s ease;
    cursor:pointer;
}

.btn-primary{
    background:var(--yellow);
    color:#111;
    border-color:var(--yellow);
}

.btn-primary:hover{
    background:var(--yellow2);
    transform:translateY(-2px);
}

.btn-dark{
    background:rgba(255,255,255,.05);
}

body.light .btn-dark{
    background:#fff;
}

.btn-dark:hover{
    transform:translateY(-2px);
    border-color:var(--yellow);
}


/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    right:0;
    left:0;
    z-index:1000;
    background:rgba(16,18,20,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

body.light header{
    background:rgba(244,244,241,.88);
}

.nav{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:180px;
}

.logo-image{
    width:45px;
    height:45px;
    object-fit:cover;
    border-radius:10px;
    background:#fff;
}

.logo-text strong{
    display:block;
    font-size:17px;
    line-height:1.2;
}

.logo-text span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav-links a{
    color:var(--muted);
    font-size:13px;
    transition:.2s;
}

.nav-links a:hover{
    color:var(--yellow);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--text);
    cursor:pointer;
    font-size:17px;
}

.menu-btn{
    display:none;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    padding-top:78px;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.hero-bg{
    position:absolute;
    inset:0;
    z-index:-3;
    background:
        linear-gradient(
            90deg,
            rgba(10,11,12,.96) 0%,
            rgba(10,11,12,.86) 40%,
            rgba(10,11,12,.52) 100%
        ),
        url("images/home/industrial-complex-aerial.jpg")
        center/cover no-repeat;
}

body.light .hero-bg{
    background:
        linear-gradient(
            90deg,
            rgba(244,244,241,.94) 0%,
            rgba(244,244,241,.82) 45%,
            rgba(244,244,241,.48) 100%
        ),
        url("images/home/industrial-complex-aerial.jpg")
        center/cover no-repeat;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:50px;
    align-items:center;
}

.hero-content{
    max-width:760px;
}

.hero-tag{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:8px 13px;
    border:1px solid rgba(245,185,0,.35);
    background:rgba(245,185,0,.08);
    color:var(--yellow);
    border-radius:30px;
    font-size:12px;
    margin-bottom:22px;
}

.hero-tag span{
    width:7px;
    height:7px;
    background:var(--yellow);
    border-radius:50%;
    box-shadow:0 0 15px var(--yellow);
}

.hero h1{
    font-size:clamp(40px,7vw,78px);
    line-height:1.15;
    letter-spacing:-3px;
    font-weight:900;
    margin-bottom:25px;
}

.hero h1 em{
    color:var(--yellow);
    font-style:normal;
}

.hero-text{
    max-width:650px;
    color:#c4c8cc;
    font-size:17px;
    line-height:2;
    margin-bottom:32px;
}

body.light .hero-text{
    color:#555;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.hero-stats{
    margin-top:55px;
    display:flex;
    flex-wrap:wrap;
    gap:35px;
}

.stat strong{
    display:block;
    font-size:25px;
    color:var(--text);
}

.stat span{
    color:var(--muted);
    font-size:11px;
}

.hero-card{
    background:rgba(20,23,25,.76);
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    padding:22px;
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
}

body.light .hero-card{
    background:rgba(255,255,255,.78);
}

.hero-card-image{
    height:330px;
    border-radius:18px;
    overflow:hidden;
    background:var(--card2);
}

.hero-card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-card-info{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding-top:18px;
}

.hero-card-info strong{
    font-size:15px;
}

.hero-card-info span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}


/* =========================
   SERVICES
========================= */

.services{
    background:var(--bg2);
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.service-card{
    position:relative;
    min-height:350px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card);
    transition:.3s ease;
}

.service-card:hover{
    transform:translateY(-7px);
    border-color:rgba(245,185,0,.45);
}

.service-image{
    height:190px;
    background:var(--card2);
    overflow:hidden;
}

.service-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s ease;
}

.service-card:hover .service-image img{
    transform:scale(1.05);
}

.service-body{
    padding:22px;
}

.service-number{
    color:var(--yellow);
    font-size:11px;
    font-weight:bold;
}

.service-body h3{
    font-size:21px;
    margin:4px 0 8px;
}

.service-body p{
    color:var(--muted);
    font-size:12px;
    line-height:1.9;
}


/* =========================
   IRON
========================= */

.iron{
    background:var(--bg);
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.product-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-5px);
    border-color:rgba(245,185,0,.4);
}

.product-image{
    height:230px;
    background:var(--card2);
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-info{
    padding:20px;
}

.product-info h3{
    font-size:18px;
    margin-bottom:6px;
}

.product-info p{
    color:var(--muted);
    font-size:12px;
    margin-bottom:16px;
}

.product-link{
    color:var(--yellow);
    font-size:12px;
    font-weight:bold;
}


/* =========================
   FEATURE SECTIONS
========================= */

.feature{
    background:var(--bg2);
}

.feature-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.feature.reverse .feature-image{
    order:2;
}

.feature-image{
    height:500px;
    border-radius:28px;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
}

.feature-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.feature-content h2{
    font-size:clamp(30px,5vw,50px);
    line-height:1.3;
    margin-bottom:20px;
}

.feature-content > p{
    color:var(--muted);
    font-size:15px;
    margin-bottom:25px;
}

.feature-list{
    display:grid;
    gap:12px;
    margin-bottom:30px;
}

.feature-list li{
    list-style:none;
    display:flex;
    align-items:flex-start;
    gap:12px;
    color:var(--text);
    font-size:13px;
}

.feature-list li::before{
    content:"✓";
    flex-shrink:0;
    width:22px;
    height:22px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(245,185,0,.12);
    color:var(--yellow);
    font-weight:bold;
}


/* =========================
   PROJECTS
========================= */

.projects{
    background:var(--bg);
}

.project-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.project{
    position:relative;
    height:330px;
    border-radius:22px;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
}

.project img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.project:hover img{
    transform:scale(1.06);
}

.project-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    padding:24px;
    background:
        linear-gradient(
            transparent 35%,
            rgba(0,0,0,.9)
        );
}

.project-overlay h3{
    font-size:18px;
}

.project-overlay p{
    color:#bbb;
    font-size:11px;
    margin-top:3px;
}


/* =========================
   CTA
========================= */

.cta{
    padding:90px 0;
    background:
        linear-gradient(
            135deg,
            rgba(245,185,0,.13),
            transparent 50%
        ),
        var(--bg2);
}

.cta-box{
    border:1px solid rgba(245,185,0,.25);
    background:
        linear-gradient(
            135deg,
            rgba(245,185,0,.08),
            rgba(255,255,255,.015)
        );
    border-radius:30px;
    padding:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:40px;
}

.cta h2{
    font-size:clamp(28px,5vw,48px);
    line-height:1.35;
    margin-bottom:10px;
}

.cta p{
    color:var(--muted);
    font-size:14px;
}

.cta-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}


/* =========================
   CONTACT
========================= */

.contact{
    background:var(--bg);
}

.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.contact-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:28px;
}

.contact-card h3{
    margin-bottom:22px;
    font-size:22px;
}

.contact-items{
    display:grid;
    gap:14px;
}

.contact-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.035);
}

body.light .contact-item{
    background:#f3f3ef;
}

.contact-icon{
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:rgba(245,185,0,.12);
    color:var(--yellow);
    font-size:18px;
}

.contact-item strong{
    display:block;
    font-size:13px;
}

.contact-item span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.map-box{
    min-height:100%;
    border-radius:22px;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            rgba(245,185,0,.08),
            transparent
        ),
        var(--card);
    border:1px solid var(--border);
    padding:30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.map-placeholder{
    min-height:260px;
    border-radius:18px;
    border:1px dashed rgba(245,185,0,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.025) 0,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 12px
        );
}

.map-placeholder strong{
    display:block;
    font-size:20px;
    margin-bottom:8px;
}

.map-placeholder span{
    color:var(--muted);
    font-size:12px;
}


/* =========================
   FOOTER
========================= */

footer{
    background:#0a0b0c;
    border-top:1px solid var(--border);
    padding:55px 0 25px;
}

body.light footer{
    background:#151719;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.4fr .8fr .8fr;
    gap:50px;
    padding-bottom:40px;
}

.footer-brand p{
    color:#8e9499;
    font-size:12px;
    max-width:430px;
    margin-top:15px;
}

.footer-title{
    font-size:13px;
    margin-bottom:15px;
    color:#fff;
}

.footer-links{
    display:grid;
    gap:9px;
}

.footer-links a{
    color:#8e9499;
    font-size:11px;
    transition:.2s;
}

.footer-links a:hover{
    color:var(--yellow);
}

.footer-bottom{
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.07);
    color:#777;
    font-size:10px;
    display:flex;
    justify-content:space-between;
    gap:20px;
}


/* =========================
   FLOATING BUTTONS
========================= */

.floating{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:900;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.float-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--yellow);
    color:#111;
    font-size:19px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    transition:.25s;
}

.float-btn:hover{
    transform:translateY(-3px) scale(1.03);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .nav-links{
        gap:16px;
    }

    .service-grid,
    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .hero-grid{
        grid-template-columns:1fr;
    }

    .hero-card{
        max-width:600px;
    }

    .feature-grid{
        gap:35px;
    }

}

@media(max-width:760px){

    section{
        padding:75px 0;
    }

    .container{
        width:min(92%,600px);
    }

    .nav{
        height:68px;
    }

    .nav-links{
        position:absolute;
        top:68px;
        right:4%;
        left:4%;
        display:none;
        flex-direction:column;
        align-items:stretch;
        gap:0;
        padding:10px;
        background:var(--card);
        border:1px solid var(--border);
        border-radius:18px;
        box-shadow:var(--shadow);
    }

    .nav-links.active{
        display:flex;
    }

    .nav-links a{
        padding:13px;
        border-radius:10px;
    }

    .nav-links a:hover{
        background:rgba(245,185,0,.08);
    }

    .menu-btn{
        display:block;
    }

    .logo{
        min-width:auto;
    }

    .logo-text strong{
        font-size:14px;
    }

    .logo-text span{
        font-size:8px;
    }

    .logo-image{
        width:40px;
        height:40px;
    }

    .nav-actions{
        margin-right:auto;
    }

    .hero{
        min-height:auto;
        padding-top:125px;
        padding-bottom:75px;
    }

    .hero-bg{
        background:
            linear-gradient(
                180deg,
                rgba(10,11,12,.84),
                rgba(10,11,12,.97)
            ),
            url("images/home/industrial-complex-aerial.jpg")
            center/cover no-repeat;
    }

    body.light .hero-bg{
        background:
            linear-gradient(
                180deg,
                rgba(244,244,241,.78),
                rgba(244,244,241,.96)
            ),
            url("images/home/industrial-complex-aerial.jpg")
            center/cover no-repeat;
    }

    .hero h1{
        font-size:43px;
        letter-spacing:-1.5px;
    }

    .hero-text{
        font-size:14px;
    }

    .hero-card{
        display:none;
    }

    .hero-stats{
        margin-top:35px;
        gap:25px;
    }

    .section-head{
        display:block;
        margin-bottom:30px;
    }

    .section-description{
        margin-top:15px;
    }

    .service-grid,
    .product-grid,
    .project-grid{
        grid-template-columns:1fr;
    }

    .service-card{
        min-height:auto;
    }

    .service-image{
        height:220px;
    }

    .product-image{
        height:250px;
    }

    .feature-grid{
        grid-template-columns:1fr;
        gap:30px;
    }

    .feature.reverse .feature-image{
        order:0;
    }

    .feature-image{
        height:320px;
    }

    .cta-box{
        padding:32px 24px;
        display:block;
    }

    .cta-buttons{
        margin-top:25px;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

    .map-box{
        min-height:350px;
    }

    .footer-grid{
        grid-template-columns:1fr;
        gap:30px;
    }

    .footer-bottom{
        display:block;
    }

    .footer-bottom span{
        display:block;
        margin-top:7px;
    }

    .floating{
        left:12px;
        bottom:12px;
    }

    .float-btn{
        width:46px;
        height:46px;
    }

}

@media(max-width:390px){

    .hero h1{
        font-size:37px;
    }

    .hero-buttons{
        display:grid;
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }

    .logo-text{
        display:none;
    }

}


/* =========================
   IMAGE FALLBACK
========================= */

.image-fallback{
    width:100%;
    height:100%;
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    background:
        linear-gradient(
            135deg,
            rgba(245,185,0,.08),
            transparent
        ),
        var(--card2);
    padding:20px;
    font-size:12px;
}
</style>
</head>


<body>

<!-- =========================
     HEADER
========================= -->

<header>

<div class="container nav">
