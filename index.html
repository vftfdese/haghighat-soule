<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="حقیقت سوله | فروش آهن‌آلات، فونداسیون، جرثقیل و سوله‌سازی"
  >

  <title>
    حقیقت سوله | تأمین و اجرای پروژه‌های صنعتی
  </title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      line-height: 1.8;

      transition:
        background 0.3s ease,
        color 0.3s ease;
    }


    a {
      text-decoration: none;
      color: inherit;
    }


    img {
      max-width: 100%;
    }


    button {
      font-family: inherit;
    }



    /* =====================================================
       DARK MODE
    ===================================================== */

    :root {

      --bg: #0a0a0a;

      --bg-2: #111111;

      --card: #151515;

      --card-2: #1a1a1a;

      --border: #292929;

      --text: #ffffff;

      --muted: #999999;

      --yellow: #f2c200;

      --yellow-dark: #cba300;

      --header: rgba(10,10,10,0.94);

      --shadow:
        0 20px 60px rgba(0,0,0,0.35);
    }



    /* =====================================================
       LIGHT MODE
    ===================================================== */

    body.light {

      --bg: #f4f4f2;

      --bg-2: #ffffff;

      --card: #ffffff;

      --card-2: #eeeeeb;

      --border: #ddddda;

      --text: #151515;

      --muted: #666666;

      --yellow: #d8a900;

      --yellow-dark: #b68f00;

      --header: rgba(255,255,255,0.94);

      --shadow:
        0 20px 60px rgba(0,0,0,0.08);
    }



    /* =====================================================
       HEADER
    ===================================================== */

    .header {

      position: sticky;

      top: 0;

      z-index: 1000;

      width: 100%;

      background:
        var(--header);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      border-bottom:
        1px solid var(--border);
    }


    .header-inner {

      width: 90%;

      max-width: 1300px;

      height: 78px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;
    }


    .brand-logo {

      width: 48px;

      height: 48px;

      border-radius: 8px;

      object-fit: contain;

      background: white;

      border: 1px solid var(--border);
    }


    .brand-text {

      min-width: 0;
    }


    .brand-name {

      font-size: 18px;

      font-weight: 900;

      white-space: nowrap;
    }


    .brand-desc {

      color: var(--muted);

      font-size: 10px;

      white-space: nowrap;
    }


    .nav {

      display: flex;

      align-items: center;

      gap: 24px;
    }


    .nav a {

      color: var(--muted);

      font-size: 12px;

      transition:
        color 0.2s ease;
    }


    .nav a:hover {

      color: var(--yellow);
    }


    .header-actions {

      display: flex;

      align-items: center;

      gap: 8px;
    }


    .icon-button {

      width: 40px;

      height: 40px;

      border:
        1px solid var(--border);

      background: var(--card);

      color: var(--text);

      border-radius: 8px;

      cursor: pointer;

      font-size: 17px;

      display: flex;

      align-items: center;

      justify-content: center;

      transition:
        0.2s ease;
    }


    .icon-button:hover {

      border-color:
        var(--yellow);

      color:
        var(--yellow);
    }


    .header-call {

      padding:
        9px 14px;

      background:
        var(--yellow);

      color:
        #111;

      border-radius:
        7px;

      font-size:
        11px;

      font-weight:
        900;
    }


    .mobile-menu {

      display: none;
    }



    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      position: relative;

      min-height: 700px;

      overflow: hidden;

      display: flex;

      align-items: center;

      background:
        #111;
    }


    .hero-image {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      opacity: 0.43;
    }


    .hero-overlay {

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.95),
          rgba(0,0,0,0.70),
          rgba(0,0,0,0.35)
        );
    }


    .hero-content {

      position: relative;

      z-index: 2;

      width: 90%;

      max-width: 1300px;

      margin: auto;

      padding:
        100px 0 150px;
    }


    .hero-badge {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        7px 12px;

      border-right:
        3px solid var(--yellow);

      background:
        rgba(242,194,0,0.08);

      color:
        var(--yellow);

      font-size:
        11px;

      font-weight:
        bold;

      margin-bottom:
        22px;
    }


    .hero-title {

      max-width:
        850px;

      font-size:
        clamp(40px, 6vw, 78px);

      line-height:
        1.2;

      font-weight:
        900;

      letter-spacing:
        -2px;
    }


    .hero-title span {

      color:
        var(--yellow);
    }


    .hero-description {

      max-width:
        650px;

      margin-top:
        25px;

      color:
        #cccccc;

      font-size:
        16px;

      line-height:
        2.1;
    }


    .hero-buttons {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        12px;

      margin-top:
        32px;
    }


    .btn-primary {

      padding:
        13px 23px;

      background:
        var(--yellow);

      color:
        #111;

      border-radius:
        7px;

      font-size:
        12px;

      font-weight:
        900;
    }


    .btn-secondary {

      padding:
        13px 23px;

      border:
        1px solid #555;

      background:
        rgba(255,255,255,0.05);

      color:
        white;

      border-radius:
        7px;

      font-size:
        12px;

      font-weight:
        bold;
    }


    .hero-stats {

      position: absolute;

      z-index: 3;

      bottom: 0;

      left: 0;

      width: 100%;

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      background:
        rgba(0,0,0,0.75);

      border-top:
        1px solid rgba(255,255,255,0.1);
    }


    .hero-stat {

      padding:
        18px 6%;

      border-left:
        1px solid rgba(255,255,255,0.1);
    }


    .hero-stat:last-child {

      border-left:
        none;
    }


    .hero-stat strong {

      display:
        block;

      color:
        white;

      font-size:
        13px;
    }


    .hero-stat span {

      color:
        #999;

      font-size:
        10px;
    }



    /* =====================================================
       GENERAL SECTION
    ===================================================== */

    .section {

      width: 90%;

      max-width: 1300px;

      margin: auto;

      padding:
        100px 0;
    }


    .section-header {

      max-width:
        750px;

      margin-bottom:
        45px;
    }


    .section-label {

      color:
        var(--yellow);

      font-size:
        11px;

      font-weight:
        900;

      margin-bottom:
        10px;
    }


    .section-title {

      font-size:
        clamp(30px,4vw,48px);

      line-height:
        1.3;

      font-weight:
        900;
    }


    .section-title span {

      color:
        var(--yellow);
    }


    .section-description {

      margin-top:
        15px;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        2;
    }



    /* =====================================================
       SERVICES
    ===================================================== */

    .services-section {

      background:
        var(--bg);
    }


    .services-grid {

      display:
        grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap:
        18px;
    }


    .service-card {

      position:
        relative;

      min-height:
        350px;

      overflow:
        hidden;

      border:
        1px solid var(--border);

      border-radius:
        14px;

      background:
        var(--card);

      box-shadow:
        var(--shadow);

      transition:
        transform 0.3s ease,
        border-color 0.3s ease;
    }


    .service-card:hover {

      transform:
        translateY(-7px);

      border-color:
        var(--yellow);
    }


    .service-image {

      width:
        100%;

      height:
        100%;

      min-height:
        350px;

      object-fit:
        cover;

      position:
        absolute;

      inset:
        0;

      opacity:
        0.52;

      transition:
        transform 0.5s ease;
    }


    .service-card:hover
    .service-image {

      transform:
        scale(1.05);
    }


    .service-overlay {

      position:
        absolute;

      inset:
        0;

      background:
        linear-gradient(
          0deg,
          rgba(0,0,0,0.94),
          rgba(0,0,0,0.35)
        );
    }


    .service-number {

      position:
        absolute;

      top:
        20px;

      left:
        22px;

      color:
        var(--yellow);

      font-size:
        12px;

      font-weight:
        900;

      z-index:
        2;
    }


    .service-content {

      position:
        absolute;

      z-index:
        2;

      right:
        25px;

      bottom:
        24px;

      left:
        25px;

      color:
        white;
    }


    .service-content h3 {

      font-size:
        27px;

      font-weight:
        900;

      margin-bottom:
        7px;
    }


    .service-content p {

      max-width:
        600px;

      color:
        #cccccc;

      font-size:
        12px;

      line-height:
        2;
    }


    .service-link {

      display:
        inline-block;

      margin-top:
        13px;

      color:
        var(--yellow);

      font-size:
        11px;

      font-weight:
        bold;
    }



    /* =====================================================
       IRON
    ===================================================== */

    .iron-section {

      background:
        var(--bg-2);

      border-top:
        1px solid var(--border);
    }


    .products-grid {

      display:
        grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap:
        16px;
    }


    .product-card {

      overflow:
        hidden;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        12px;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease;
    }


    .product-card:hover {

      transform:
        translateY(-5px);

      border-color:
        var(--yellow);
    }


    .product-image {

      position:
        relative;

      height:
        210px;

      overflow:
        hidden;

      background:
        #222;
    }


    .product-image img {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

      display:
        block;

      transition:
        transform 0.4s ease;
    }


    .product-card:hover
    .product-image img {

      transform:
        scale(1.05);
    }


    .product-body {

      padding:
        20px;
    }


    .product-body h3 {

      font-size:
        20px;

      margin-bottom:
        7px;
    }


    .product-body p {

      color:
        var(--muted);

      font-size:
        11px;

      line-height:
        2;
    }


    .product-button {

      display:
        block;

      margin-top:
        15px;

      padding:
        10px;

      background:
        var(--yellow);

      color:
        #111;

      border-radius:
        6px;

      text-align:
        center;

      font-size:
        11px;

      font-weight:
        900;
    }



    /* =====================================================
       PROJECT SERVICE SECTIONS
    ===================================================== */

    .service-detail {

      border-top:
        1px solid var(--border);

      background:
        var(--bg);
    }


    .detail-box {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        45px;

      align-items:
        center;
    }


    .detail-image {

      width:
        100%;

      height:
        450px;

      object-fit:
        cover;

      border-radius:
        14px;

      border:
        1px solid var(--border);
    }


    .detail-content h2 {

      font-size:
        clamp(30px,4vw,48px);

      line-height:
        1.3;

      margin-bottom:
        18px;
    }


    .detail-content h2 span {

      color:
        var(--yellow);
    }


    .detail-content p {

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        2.2;
    }


    .detail-list {

      list-style:
        none;

      margin-top:
        25px;

      display:
        grid;

      gap:
        10px;
    }


    .detail-list li {

      padding:
        11px 14px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        7px;

      font-size:
        12px;
    }


    .detail-list li::before {

      content:
        "✓";

      color:
        var(--yellow);

      font-weight:
        bold;

      margin-left:
        8px;
    }



    /* =====================================================
       CTA
    ===================================================== */

    .cta-section {

      padding:
        80px 0;

      background:
        var(--bg-2);
    }


    .cta {

      width:
        90%;

      max-width:
        1300px;

      margin:
        auto;

      padding:
        45px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-right:
        4px solid var(--yellow);

      border-radius:
        14px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        30px;
    }


    .cta h2 {

      font-size:
        28px;

      margin-bottom:
        8px;
    }


    .cta p {

      color:
        var(--muted);

      font-size:
        13px;
    }


    .cta-buttons {

      display:
        flex;

      gap:
        10px;

      flex-shrink:
        0;
    }


    .whatsapp {

      padding:
        13px 20px;

      background:
        #168c4a;

      color:
        white;

      border-radius:
        7px;

      font-size:
        12px;

      font-weight:
        bold;
    }



    /* =====================================================
       CONTACT
    ===================================================== */

    .contact-section {

      background:
        var(--bg);

      border-top:
        1px solid var(--border);
    }


    .contact-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:
        15px;
    }


    .contact-card {

      padding:
        28px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        10px;
    }


    .contact-card small {

      display:
        block;

      color:
        var(--yellow);

      font-size:
        10px;

      margin-bottom:
        7px;
    }


    .contact-card strong {

      font-size:
        15px;
    }


    .contact-card p {

      color:
        var(--muted);

      font-size:
        11px;

      margin-top:
        5px;
    }



    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {

      padding:
        35px 5%;

      background:
        #080808;

      color:
        #777;

      text-align:
        center;

      font-size:
        11px;

      border-top:
        1px solid #222;
    }


    body.light .footer {

      background:
        #151515;

      color:
        #aaa;
    }



    /* =====================================================
       FLOATING BUTTONS
    ===================================================== */

    .floating {

      position:
        fixed;

      z-index:
        999;

      left:
        18px;

      bottom:
        18px;

      display:
        flex;

      flex-direction:
        column;

      gap:
        8px;
    }


    .floating a {

      width:
        48px;

      height:
        48px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        50%;

      font-size:
        18px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.25);
    }


    .floating-call {

      background:
        var(--yellow);

      color:
        #111;
    }


    .floating-whatsapp {

      background:
        #168c4a;

      color:
        white;
    }



    /* =====================================================
       BACK TO TOP
    ===================================================== */

    .back-top {

      position:
        fixed;

      right:
        18px;

      bottom:
        18px;

      width:
        42px;

      height:
        42px;

      border:
        1px solid var(--border);

      border-radius:
        50%;

      background:
        var(--card);

      color:
        var(--text);

      cursor:
        pointer;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        17px;

      z-index:
        900;
    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 850px) {

      .nav {
        display:
          none;
      }


      .mobile-menu {
        display:
          flex;
      }


      .header-inner {
        height:
          68px;
      }


      .header-call {
        display:
          none;
      }


      .hero {
        min-height:
          690px;
      }


      .hero-content {
        width:
          90%;

        padding:
          80px 0 155px;
      }


      .hero-title {
        font-size:
          42px;

        letter-spacing:
          -1px;
      }


      .hero-description {
        font-size:
          13px;
      }


      .hero-buttons {
        flex-direction:
          column;
      }


      .btn-primary,
      .btn-secondary {
        text-align:
          center;
      }


      .hero-stats {

        grid-template-columns:
          1fr;
      }


      .hero-stat {

        padding:
          9px 5%;

        border-left:
          none;

        border-bottom:
          1px solid rgba(255,255,255,0.08);
      }


      .hero-stat:last-child {

        border-bottom:
          none;
      }


      .services-grid {

        grid-template-columns:
          1fr;
      }


      .service-card {

        min-height:
          300px;
      }


      .service-image {

        min-height:
          300px;
      }


      .products-grid {

        grid-template-columns:
          repeat(2,1fr);
      }


      .detail-box {

        grid-template-columns:
          1fr;

        gap:
          25px;
      }
